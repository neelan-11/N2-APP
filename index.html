<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>N²</title><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="N²"><link rel="apple-touch-icon" href="icons/icon-180.png"><style>
:root{--r:#ef233c;--bg:#090b10;--p:#151a23;--l:#2a3342;--m:#919bad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px system-ui,-apple-system;padding:env(safe-area-inset-top) 0 calc(94px + env(safe-area-inset-bottom))}.app{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#f32945,#9d0d25);display:grid;place-items:center;font-weight:950;font-size:23px}.card{background:linear-gradient(145deg,#181e29,#10141b);border:1px solid var(--l);border-radius:20px;padding:14px;margin:12px 0}.hero{padding:18px;border-radius:25px;background:radial-gradient(circle at 100% 0,#46101c,#151a23 42%);border:1px solid #323b4c}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.mut{color:var(--m);font-size:11px}.lvl{font-size:31px;color:#f5c451;font-weight:900}.track{height:10px;background:#080a0f;border-radius:9px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--r),#9b7cff,#6aa8ff)}button,input,select{font:inherit}.btn{border:1px solid #394457;border-radius:12px;padding:10px 12px;background:#111722;color:#fff}.primary{background:linear-gradient(145deg,var(--r),#a80f29);border-color:#ff5268}.fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:var(--r);border:1px solid #ff6679;color:#fff;font-size:32px;z-index:9;box-shadow:0 10px 30px #0008}.nav{position:fixed;bottom:0;left:0;right:0;background:#0e1219ee;backdrop-filter:blur(18px);border-top:1px solid #283142;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:8}.nav button{border:0;background:none;color:#7f8da3;font-size:10px;padding:6px}.nav button.on{color:#fff}.nav i{display:block;font-style:normal;font-size:19px}.screen{display:none}.screen.on{display:block}.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#111722;border:1px solid #293345;border-radius:16px;padding:11px;margin:8px 0}.ico{width:42px;height:42px;border-radius:13px;background:#0a0e14;display:grid;place-items:center;font-size:21px}.check{width:36px;height:36px;border-radius:12px;border:1px solid #3b4659;background:#0a0e14;color:#fff}.check.on{background:var(--r)}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}.tag{font-size:9px;color:#aab5c7;border:1px solid #334056;border-radius:10px;padding:3px 6px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.chart{background:#111722;border:1px solid #293345;border-radius:15px;padding:10px}.bar{height:8px;background:#232b38;border-radius:9px;overflow:hidden;margin-top:7px}.bar b{display:block;height:100%;background:var(--r)}.char{height:265px;border-radius:22px;background:radial-gradient(circle at 50% 20%,#34476f,#0d1118 65%);position:relative;overflow:hidden}.person{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);width:160px;height:220px}.head{position:absolute;left:35px;top:12px;width:90px;height:98px;border-radius:45%;background:var(--skin,#dca77f);border:4px solid #17120f}.hair{position:absolute;left:31px;top:0;width:98px;height:48px;border-radius:45px 45px 18px 18px;background:var(--hair,#251b18);z-index:2}.head:before,.head:after{content:'';position:absolute;top:42px;width:7px;height:7px;border-radius:50%;background:var(--eye,#16100d)}.head:before{left:24px}.head:after{right:24px}.body{position:absolute;left:17px;bottom:0;width:126px;height:130px;border-radius:40px 40px 18px 18px;background:#34445f;border:4px solid #151a22}.badgegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.badge{min-height:80px;border:1px solid #394457;border-radius:14px;padding:8px 4px;text-align:center;background:#121722;font-size:9px}.badge.lock{opacity:.25;filter:grayscale(1)}.badge strong{display:block;font-size:20px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}.modal.on{display:flex}.sheet{width:min(760px,100%);margin:auto;background:#111722;border-radius:25px 25px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.field{margin:9px 0}.field label{display:block;color:var(--m);font-size:10px;margin:0 0 5px}.input{width:100%;padding:11px;border-radius:12px;border:1px solid #394457;background:#090d14;color:#fff}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.days button{padding:9px 2px;border-radius:10px;border:1px solid #394457;background:#090d14;color:#9aa5b8}.days button.on{background:#4a1821;color:#fff;border-color:var(--r)}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.colors input{width:100%;height:42px;border:0;background:none}.empty{text-align:center;color:var(--m);padding:24px 8px}.tiny{font-size:10px;color:var(--m)}
</style></head><body><div class="app"><div class="top"><div class="brand"><div class="logo">N²</div><div><b>N²</b><div class="mut" id="date"></div></div></div><div>🔥 <b id="streak">0</b></div></div>
<section id="home" class="screen on"><div class="hero"><div class="row between"><div><div class="mut">LIVELLO</div><div class="lvl" id="lv">1</div></div><div style="flex:1"><b id="rank">Recluta</b><div class="mut" id="xptext"></div><div class="track"><div class="fill" id="xpbar"></div></div></div></div><div class="row between" style="margin-top:15px"><div><b id="doneToday">0</b><div class="mut">oggi</div></div><div><b id="perfect">0</b><div class="mut">giorni perfetti</div></div><div><b id="totalxp">0</b><div class="mut">XP</div></div></div></div><h3>Missioni di oggi</h3><div id="todayList"></div><h3>Prossimi badge</h3><div class="badgegrid" id="homeBadges"></div></section>
<section id="tasks" class="screen"><h2>⚔ Task</h2><div id="taskList"></div></section><section id="habits" class="screen"><h2>↻ Abitudini</h2><div id="habitList"></div></section><section id="stats" class="screen"><h2>◔ Statistiche</h2><div class="card"><b>Costanza ultimi 30 giorni</b><div class="charts" id="charts" style="margin-top:10px"></div></div></section><section id="character" class="screen"><h2>♟ Personaggio</h2><div class="char"><div class="person" id="person"><div class="hair"></div><div class="head"></div><div class="body"></div></div></div><div class="card"><div class="row between"><div><b id="charName">Eroe</b><div class="mut" id="charSub"></div></div><button class="btn" onclick="rename()">Rinomina</button></div><h4>Aspetto base</h4><div class="colors"><div><div class="tiny">Pelle</div><input type="color" id="skin" oninput="setColor('skin',this.value)"></div><div><div class="tiny">Capelli</div><input type="color" id="hair" oninput="setColor('hair',this.value)"></div><div><div class="tiny">Occhi</div><input type="color" id="eye" oninput="setColor('eye',this.value)"></div></div></div><h3>Badge</h3><div class="badgegrid" id="badges"></div></section></div>
<button class="fab" onclick="openAdd()">+</button><nav class="nav"> <button class="on" onclick="show('home',this)"><i>⌂</i>Home</button><button onclick="show('tasks',this)"><i>⚔</i>Task</button><button onclick="show('habits',this)"><i>↻</i>Abitudini</button><button onclick="show('stats',this)"><i>◔</i>Statistiche</button><button onclick="show('character',this)"><i>♟</i>Personaggio</button></nav>
<div class="modal" id="modal"><div class="sheet"><h3>Nuova missione</h3><div class="field"><label>Tipo</label><select class="input" id="type" onchange="sync()"><option value="habit">Abitudine</option><option value="task">Task</option></select></div><div class="field"><label>Nome</label><input class="input" id="name" placeholder="Es. Allenamento"></div><div class="field" id="iconF"><label>Logo / emoji</label><input class="input" id="icon" value="🎯" maxlength="3"></div><div class="field"><label>Categoria</label><select class="input" id="cat"><option>Salute</option><option>Fitness</option><option>Studio</option><option>Lavoro</option><option>Dovere</option><option>Piaceri</option></select></div><div class="field"><label>Difficoltà</label><select class="input" id="diff"><option value="easy">Facile · 20 XP</option><option value="normal">Normale · 35 XP</option><option value="hard">Difficile · 60 XP</option></select></div><div id="habitF"><div class="field"><label>Giorni</label><div class="days" id="days"></div></div><label><input type="checkbox" id="repeat" checked> Ripeti automaticamente ogni settimana</label></div><div class="field" id="dueF" style="display:none"><label>Scadenza</label><input type="date" class="input" id="due"></div><div class="row" style="margin-top:14px"><button class="btn" style="flex:1" onclick="closeM()">Annulla</button><button class="btn primary" style="flex:1" onclick="saveItem()">Crea</button></div></div></div>
<script>
const K='n2app3',C=['Salute','Fitness','Studio','Lavoro','Dovere','Piaceri'],CI={Salute:'❤',Fitness:'🏋️',Studio:'📚',Lavoro:'💼',Dovere:'✓',Piaceri:'🎮'},DN=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];let S=JSON.parse(localStorage.getItem(K)||'null')||{xp:0,habits:[],tasks:[],perfect:{},char:{name:'Eroe',skin:'#dca77f',hair:'#251b18',eye:'#16100d'}};let sel=[0,1,2,3,4,5,6];const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10),xpVal=d=>d==='hard'?60:d==='easy'?20:35;function need(l){return 80+Math.floor(17*l+2.5*l*l)}function level(){let x=S.xp,l=1;while(l<100&&x>=need(l)){x-=need(l);l++}return[l,x,l<100?need(l):1]}function rank(l){return l<10?'Recluta':l<25?'Esploratore':l<50?'Veterano':l<75?'Elite':l<100?'Leggenda':'N²'}function save(){localStorage.setItem(K,JSON.stringify(S));render()}function eligible(h,d=new Date()){if(!h.repeat&&h.week!==week(d))return false;return h.days.includes(d.getDay())}function week(d=new Date()){let x=new Date(d),q=(x.getDay()+6)%7;x.setDate(x.getDate()-q);return x.toISOString().slice(0,10)}function complete(o,isH){let k=today();if(isH){o.hist=o.hist||{};if(o.hist[k]){delete o.hist[k];S.xp=Math.max(0,S.xp-xpVal(o.diff))}else{o.hist[k]=1;S.xp+=xpVal(o.diff)}}else{if(o.done){o.done=false;S.xp=Math.max(0,S.xp-xpVal(o.diff))}else{o.done=true;o.doneAt=k;S.xp+=xpVal(o.diff)}}save()}function streak(){let n=0,d=new Date();for(let i=0;i<365;i++){let k=d.toISOString().slice(0,10),hs=S.habits.filter(h=>eligible(h,d));if(!hs.length){d.setDate(d.getDate()-1);continue}if(hs.every(h=>h.hist&&h.hist[k]))n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}function badgeDefs(){let a=[];for(let l=1;l<=100;l++)a.push({n:'Livello '+l,i:l%10===0?'🏆':'🏅',ok:level()[0]>=l});let comp=S.tasks.filter(x=>x.done).length+S.habits.reduce((n,h)=>n+Object.keys(h.hist||{}).length,0),st=streak();[['Primi passi','🌱',comp>=1],['Costante','🔥',st>=7],['Ferro','⚔️',st>=30],['Centenario','💯',comp>=100],['Titano','🗿',comp>=500],['Settimana perfetta','👑',Object.keys(S.perfect).length>=7]].forEach(x=>a.push({n:x[0],i:x[1],ok:x[2]}));return a}function render(){let [l,cur,nxt]=level();$('lv').textContent=l;$('rank').textContent=rank(l);$('xptext').textContent=l<100?cur+' / '+nxt+' XP':'LIVELLO MASSIMO';$('xpbar').style.width=(l<100?cur/nxt*100:100)+'%';$('totalxp').textContent=S.xp;$('streak').textContent=streak();let d=new Date(),k=today(),hs=S.habits.filter(h=>eligible(h,d)),ts=S.tasks.filter(t=>!t.done&&(!t.due||t.due<=k));let todayItems=[...hs.map(h=>[h,true]),...ts.map(t=>[t,false])];$('doneToday').textContent=todayItems.filter(([o,h])=>h?o.hist&&o.hist[k]:o.done).length;let all=hs.length+S.tasks.filter(t=>t.due===k).length,done=hs.filter(h=>h.hist&&h.hist[k]).length+S.tasks.filter(t=>t.due===k&&t.done).length;if(all&&done===all)S.perfect[k]=1;$('perfect').textContent=Object.keys(S.perfect).length;$('todayList').innerHTML=todayItems.length?todayItems.map(([o,h])=>card(o,h)).join(''):'<div class="empty">Nessuna missione prevista oggi.</div>';$('taskList').innerHTML=S.tasks.length?S.tasks.map(t=>card(t,false)).join(''):'<div class="empty">Aggiungi il tuo primo task.</div>';$('habitList').innerHTML=S.habits.length?S.habits.map(h=>card(h,true)).join(''):'<div class="empty">Aggiungi la tua prima abitudine.</div>';renderCharts();renderChar();let b=badgeDefs();$('badges').innerHTML=b.map(x=>`<div class="badge ${x.ok?'':'lock'}"><strong>${x.i}</strong>${x.n}</div>`).join('');$('homeBadges').innerHTML=b.filter(x=>!x.ok).slice(0,4).map(x=>`<div class="badge lock"><strong>${x.i}</strong>${x.n}</div>`).join('');localStorage.setItem(K,JSON.stringify(S))}function card(o,h){let on=h?!!(o.hist&&o.hist[today()]):o.done;return `<div class="item"><div class="ico">${h?(o.icon||'🎯'):CI[o.cat]}</div><div><b>${o.name}</b><div class="tags"><span class="tag">${o.cat}</span><span class="tag">+${xpVal(o.diff)} XP</span>${h?`<span class="tag">${o.days.map(x=>DN[x]).join(' ')}</span>`:(o.due?`<span class="tag">${o.due}</span>`:'')}</div></div><button class="check ${on?'on':''}" onclick="complete(S.${h?'habits':'tasks'}.find(x=>x.id==='${o.id}'),${h})">${on?'✓':''}</button></div>`}function renderCharts(){let now=new Date(),out='';C.forEach(c=>{let due=0,ok=0;for(let i=0;i<30;i++){let d=new Date(now);d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10);S.habits.filter(h=>h.cat===c&&eligible(h,d)).forEach(h=>{due++;if(h.hist&&h.hist[k])ok++});S.tasks.filter(t=>t.cat===c&&t.due===k).forEach(t=>{due++;if(t.done&&t.doneAt===k)ok++})}let p=due?Math.round(ok/due*100):0;out+=`<div class="chart"><b>${CI[c]} ${c}</b><div class="mut">${p}%</div><div class="bar"><b style="width:${p}%"></b></div></div>`});$('charts').innerHTML=out}function renderChar(){let c=S.char;$('charName').textContent=c.name;$('charSub').textContent='Livello '+level()[0]+' · '+rank(level()[0]);document.documentElement.style.setProperty('--skin',c.skin);document.documentElement.style.setProperty('--hair',c.hair);document.documentElement.style.setProperty('--eye',c.eye);$('skin').value=c.skin;$('hair').value=c.hair;$('eye').value=c.eye}function setColor(k,v){S.char[k]=v;save()}function rename(){let n=prompt('Nome del personaggio',S.char.name);if(n&&n.trim()){S.char.name=n.trim().slice(0,24);save()}}function show(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}function openAdd(){$('modal').classList.add('on');$('due').value=today();renderDays();sync()}function closeM(){$('modal').classList.remove('on')}function sync(){let h=$('type').value==='habit';$('habitF').style.display=h?'block':'none';$('iconF').style.display=h?'block':'none';$('dueF').style.display=h?'none':'block'}function renderDays(){$('days').innerHTML=[1,2,3,4,5,6,0].map(d=>`<button class="${sel.includes(d)?'on':''}" onclick="togDay(${d});return false">${DN[d]}</button>`).join('')}function togDay(d){sel=sel.includes(d)?sel.filter(x=>x!==d):[...sel,d];if(!sel.length)sel=[d];renderDays()}function saveItem(){let n=$('name').value.trim();if(!n)return;let common={id:Date.now().toString(36),name:n,cat:$('cat').value,diff:$('diff').value};if($('type').value==='habit')S.habits.push({...common,icon:$('icon').value||'🎯',days:[...sel],repeat:$('repeat').checked,week:week(),hist:{}});else S.tasks.push({...common,due:$('due').value,done:false,doneAt:null});$('name').value='';closeM();save()}$('date').textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});render();
</script></body></html>
